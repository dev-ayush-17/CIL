<!DOCTYPE html>
<html>
<head>
    <title>Digital Twin - Cave Explorer</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050B14; color: #F1F5F9; font-family: sans-serif; }
        #controls { 
            position: absolute; top: 15px; left: 15px; background: rgba(10, 18, 28, 0.9); 
            padding: 15px; border-radius: 8px; z-index: 10; box-shadow: 0 8px 16px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; gap: 8px; width: 220px; border: 1px solid #1B344A;
        }
        button { background: #22D3EE; border: none; padding: 8px; font-weight: bold; cursor: pointer; border-radius: 4px; color: #050B14; transition: 0.2s;}
        button:hover { background: #F1F5F9; }
        button.stop { background: #B91C1C; color: #F1F5F9; }
        button.stop:hover { background: #EF3340; }
        button.marker { background: #FFD43B; color: #050B14; margin-top: 10px; border: 1px solid #D9A514;}
        button.marker:hover { background: #F1F5F9; }
        .data-panel { font-family: monospace; font-size: 11px; color: #22D3EE; background: #0B1520; padding: 8px; border-radius: 4px; line-height: 1.4; border: 1px solid #183047;}
        .mode-toggle { display: flex; align-items: center; justify-content: space-between; background: #0B1520; padding: 5px; border-radius: 4px;}
        .switch { position: relative; display: inline-block; width: 34px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #353D45; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: #F1F5F9; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #22D3EE; }
        input:checked + .slider:before { transform: translateX(14px); }
    </style>
</head>
<body>
    <div id="controls">
        <div class="mode-toggle">
            <span style="font-size: 12px; font-weight:bold; color: #F1F5F9;">Live ESP32 Data</span>
            <label class="switch">
                <input type="checkbox" id="modeSwitch" onchange="toggleMode()">
                <span class="slider"></span>
            </label>
        </div>
        <div id="ws-status" style="font-size: 11px; color: #737E88; text-align: center;">WS: Disconnected</div>

        <b style="text-align: center; margin-top: 5px; font-size: 13px; color: #F1F5F9;">Manual Control</b>
        <button onclick="playAnimation('forward')">Walk Forward</button>
        <button onclick="playAnimation('backward')">Walk Backward</button>
        <button onclick="playAnimation('left')">Turn Left</button>
        <button onclick="playAnimation('right')">Turn Right</button>
        <button class="stop" onclick="playAnimation('stop')">STOP</button>
        
        <button class="marker" onclick="dropRescueMarker()">📍 Drop Rescue Marker</button>

        <b style="text-align: center; margin-top:5px; font-size: 13px; color: #F1F5F9;">Telemetry</b>
        <div class="data-panel" id="telemetry-readout">
            Waiting for data...
        </div>

        <b style="text-align: center; margin-top:5px; font-size: 13px; color: #F1F5F9;">Tile Log Inspector</b>
        <div class="data-panel" id="tile-log-readout" style="color: #A7F3D0; min-height: 52px; max-height: 130px; overflow-y: auto;">
            Click any colored tile to view stored log...
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.150.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.150.0/examples/jsm/",
                "three/examples/jsm/": "https://unpkg.com/three@0.150.0/examples/jsm/",
                "urdf-loader": "https://unpkg.com/urdf-loader@0.12.1/src/URDFLoader.js"
            }
        }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import URDFLoader from 'urdf-loader';
        import { STLLoader } from 'three/addons/loaders/STLLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. Scene & Deep Cinematic Atmosphere
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050B14); 
        scene.fog = new THREE.FogExp2(0x050B14, 0.08); 

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 100);
        camera.position.set(1.5, 1.2, 2.5); 

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; 
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping; 
        renderer.toneMappingExposure = 0.9; 
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 2. Sophisticated Lighting
        const ambientLight = new THREE.AmbientLight(0x1B2A3A, 1.2); 
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xD7DFE9, 2.0); 
        mainLight.position.set(4, 7, 3);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        mainLight.shadow.camera.near = 0.1;
        mainLight.shadow.camera.far = 25;
        mainLight.shadow.bias = -0.0005;
        scene.add(mainLight);

        const rimLight = new THREE.DirectionalLight(0x118BF7, 0.8); 
        rimLight.position.set(-4, 2, -4);
        scene.add(rimLight);

        // 3. Ground & Hex Grid
        const groundGeo = new THREE.PlaneGeometry(200, 200);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x050B14, roughness: 0.95, metalness: 0.05 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.01;
        ground.receiveShadow = true;
        scene.add(ground);

        const hexGrid = new THREE.Group();
        const hexRadius = 0.2;
        const hexGeom = new THREE.CircleGeometry(hexRadius, 6);
        const hexEdges = new THREE.EdgesGeometry(hexGeom);
        const hexMat = new THREE.LineBasicMaterial({ color: 0x1B344A, transparent: true, opacity: 0.6 }); 
        for (let q = -25; q <= 25; q++) {
            for (let r = -25; r <= 25; r++) {
                const hex = new THREE.LineSegments(hexEdges, hexMat);
                hex.position.set(hexRadius * Math.sqrt(3) * (q + r/2), 0, hexRadius * 3/2 * r);
                hex.rotation.x = -Math.PI / 2;
                hex.rotation.z = Math.PI / 6; 
                hexGrid.add(hex);
            }
        }
        scene.add(hexGrid);

        // 4. Cave Walls (Cool Graphite Gray)
        const envGroup = new THREE.Group();
        scene.add(envGroup);
        const maxWalls = 10000;
        const wallMat = new THREE.MeshStandardMaterial({ 
            color: 0x4C546F, 
            roughness: 0.7,
            metalness: 0.2
        });
        const wallInstanced = new THREE.InstancedMesh(new THREE.BoxGeometry(0.05, 0.2, 0.05), wallMat, maxWalls);
        wallInstanced.castShadow = true;
        wallInstanced.receiveShadow = true;
        wallInstanced.count = 0;
        scene.add(wallInstanced);
        const dummyMatrix = new THREE.Object3D();

        // 5. Robot (Clean Bright White)
        const robotGroup = new THREE.Group();
        scene.add(robotGroup);
        let robot = null;
        const manager = new THREE.LoadingManager();
        const loader = new URDFLoader(manager);
        
        loader.loadMeshCb = (path, manager, done) => {
            new STLLoader(manager).load(path, (geometry) => {
                done(new THREE.Mesh(geometry, new THREE.MeshStandardMaterial({ color: 0xF1F5F9 })));
            }, undefined, (err) => { done(null, err); });
        };
        loader.packages = { 'dog02_large_description': './' }; 
        loader.load('robot.urdf', result => {
            robot = result;
            robot.rotation.x = -Math.PI / 2; 
            robot.position.y = 0.12; 
            
            robot.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                    child.material = new THREE.MeshStandardMaterial({
                        color: 0xF1F5F9,     
                        roughness: 0.25,
                        metalness: 0.15
                    });
                }
            });
            robotGroup.add(robot); 
        });

        // State variables
        window.isLiveMode = false;
        window.activeAnim = 'stop';
        window.frameIndex = 0;
        window.currentJoints = { FrontR: 0, BackR: 0, FrontL: 0, BackL: 0, stubsliderbottom: 0, stubsliderupper: 0 };
        const animSpeed = 0.08, walkSpeed = 0.001, turnSpeed = 0.003;
        const LIFT = 0.02, SLIDE = 0.02, TURN = 0.174;
        let dummyFrameCounter = 0;

        // UI Functions
        window.toggleMode = function() {
            window.isLiveMode = document.getElementById('modeSwitch').checked;
            window.activeAnim = 'stop';
        };

        window.playAnimation = function(animName) {
            if (window.isLiveMode) return;
            window.activeAnim = animName;
            window.frameIndex = 0;
        };

        window.dropRescueMarker = function() {
            const arrowGroup = new THREE.Group();
            const markerMat = new THREE.MeshStandardMaterial({
                color: 0xFFD43B, 
                emissive: 0xD9A514, 
                emissiveIntensity: 0.6,
                roughness: 0.15,
                metalness: 0.2
            });

            const cone = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.15, 16), markerMat);
            cone.rotation.x = Math.PI;
            cone.position.y = 0.075;
            cone.castShadow = true;

            const cylinder = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.15), markerMat);
            cylinder.position.y = 0.2;
            cylinder.castShadow = true;

            arrowGroup.add(cone);
            arrowGroup.add(cylinder);
            
            arrowGroup.position.set(robotGroup.position.x, 0.15, robotGroup.position.z);
            envGroup.add(arrowGroup);
        };

        // Track which hex cells have already been colored and store logs
        const coloredHexes = new Map();
        const tileLogs = new Map();
        window.tileLogs = tileLogs;

        // 6. Data Processors & Clean Hex-Cell Grid Heatmap
        function processTelemetry(data) {
            document.getElementById('telemetry-readout').innerHTML = `
                X: ${data.pose.x.toFixed(2)} Z: ${data.pose.z.toFixed(2)}<br>
                <b>ToF:</b> L:${data.tof.left.toFixed(2)}m R:${data.tof.right.toFixed(2)}m<br>
                <b>Gases:</b><br>
                <span style="color:${data.sensors.methane > 10 ? '#EF3340' : '#22D3EE'}">CH4: ${data.sensors.methane.toFixed(1)} ppm</span><br>
                <span style="color:${data.sensors.co > 20 ? '#EF3340' : '#22D3EE'}">CO: ${data.sensors.co.toFixed(1)} ppm</span><br>
                SO2: ${data.sensors.sulfur.toFixed(1)} ppm<br>
                CO2: ${data.sensors.co2.toFixed(1)} ppm<br>
                O2: ${data.sensors.o2.toFixed(1)} %<br>
                H2O: ${data.sensors.water.toFixed(1)} %
            `;

            if(data.tof.left > 0 && data.tof.left < 2.0) plotWall(data.tof.left, Math.PI/2, data.pose);
            if(data.tof.right > 0 && data.tof.right < 2.0) plotWall(data.tof.right, -Math.PI/2, data.pose);

            let dangerLevel = 0; 
            if (data.sensors.methane > 40 || data.sensors.co > 80) dangerLevel = 4;
            else if (data.sensors.methane > 20 || data.sensors.co > 40) dangerLevel = 3;
            else if (data.sensors.methane > 10 || data.sensors.co > 20) dangerLevel = 2;
            else if (data.sensors.methane > 5 || data.sensors.co > 10) dangerLevel = 1;

            let heatColor = 0x22C55E; // Green for Safe
            if (dangerLevel === 1) heatColor = 0x84CC16; // Light Green/Yellow-Green
            if (dangerLevel === 2) heatColor = 0xF59E0B; // Warning Amber
            if (dangerLevel === 3) heatColor = 0xEF3340; // Danger Red
            if (dangerLevel === 4) heatColor = 0xB91C1C; // Critical Red

            colorCurrentHexCell(data.pose, heatColor, dangerLevel > 0 ? 0.9 : 0.4, data);
        }

        function plotWall(distance, angleOffset, pose) {
            if (wallInstanced.count >= maxWalls) return;
            const absoluteAngle = pose.yaw + angleOffset;
            dummyMatrix.position.set(pose.x + Math.sin(absoluteAngle) * distance, 0.1, pose.z + Math.cos(absoluteAngle) * distance);
            dummyMatrix.rotation.y = pose.yaw;
            dummyMatrix.updateMatrix();
            wallInstanced.setMatrixAt(wallInstanced.count, dummyMatrix.matrix);
            wallInstanced.instanceMatrix.needsUpdate = true;
            wallInstanced.count++;
        }

        function colorCurrentHexCell(pose, colorHex, opacity, fullData) {
            const r = Math.round(pose.z / (hexRadius * 3/2));
            const q = Math.round((pose.x / (hexRadius * Math.sqrt(3))) - (r / 2));
            const cellKey = `${q},${r}`;

            if (coloredHexes.has(cellKey)) return;

            const x = hexRadius * Math.sqrt(3) * (q + r/2);
            const z = hexRadius * 3/2 * r;

            const hexFillGeo = new THREE.CircleGeometry(hexRadius * 0.95, 6); 
            const hexFillMat = new THREE.MeshStandardMaterial({ 
                color: colorHex, 
                emissive: colorHex,
                emissiveIntensity: 0.8,
                transparent: true, 
                opacity: opacity, 
                side: THREE.DoubleSide,
                roughness: 0.4
            });

            const hexMesh = new THREE.Mesh(hexFillGeo, hexFillMat);
            hexMesh.rotation.x = -Math.PI / 2;
            hexMesh.rotation.z = Math.PI / 6;
            hexMesh.position.set(x, 0.002, z); 
            hexMesh.receiveShadow = true;

            if (fullData) {
                const logData = {
                    cellKey: cellKey,
                    q: q,
                    r: r,
                    x: x,
                    z: z,
                    timestamp: new Date().toLocaleTimeString(),
                    pose: { x: fullData.pose.x, z: fullData.pose.z, yaw: fullData.pose.yaw },
                    tof: fullData.tof ? { left: fullData.tof.left, right: fullData.tof.right } : { left: 0, right: 0 },
                    sensors: fullData.sensors ? { ...fullData.sensors } : {}
                };
                hexMesh.userData = { cellKey: cellKey, log: logData };
                tileLogs.set(cellKey, logData);
            }

            envGroup.add(hexMesh);
            coloredHexes.set(cellKey, hexMesh);
        }

        // Raycaster for inspecting tile log on click
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let pointerDownPos = { x: 0, y: 0 };
        let selectedTileMesh = null;

        window.addEventListener('pointerdown', (e) => {
            pointerDownPos = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointerup', (e) => {
            const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
            if (dist > 6) return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(envGroup.children, true);

            for (let hit of intersects) {
                const mesh = hit.object;
                if (mesh && mesh.userData && mesh.userData.log) {
                    const log = mesh.userData.log;

                    if (selectedTileMesh && selectedTileMesh.material && selectedTileMesh.userData.origEmissive !== undefined) {
                        selectedTileMesh.material.emissive.setHex(selectedTileMesh.userData.origEmissive);
                    }
                    selectedTileMesh = mesh;
                    mesh.userData.origEmissive = mesh.material.emissive.getHex();
                    mesh.material.emissive.setHex(0x38BDF8);

                    const logEl = document.getElementById('tile-log-readout');
                    if (logEl) {
                        logEl.innerHTML = `
                            <b style="color:#F1F5F9;">TILE [${log.cellKey}] LOG</b><br>
                            Time: ${log.timestamp}<br>
                            Pos: X:${log.pose.x.toFixed(2)}m Z:${log.pose.z.toFixed(2)}m<br>
                            <b>ToF:</b> L:${log.tof.left.toFixed(2)}m R:${log.tof.right.toFixed(2)}m<br>
                            <b>Sensors:</b><br>
                            CH4: ${log.sensors.methane !== undefined ? log.sensors.methane.toFixed(1) : '—'} ppm<br>
                            CO: ${log.sensors.co !== undefined ? log.sensors.co.toFixed(1) : '—'} ppm<br>
                            SO2: ${log.sensors.sulfur !== undefined ? log.sensors.sulfur.toFixed(1) : '—'}<br>
                            CO2: ${log.sensors.co2 !== undefined ? log.sensors.co2.toFixed(1) : '—'} | O2: ${log.sensors.o2 !== undefined ? log.sensors.o2.toFixed(1) : '—'}%
                        `;
                    }
                    break;
                }
            }
        });

        function generateDummyData() {
            const isMoving = window.activeAnim !== 'stop';
            const spike = Math.random() > 0.90; 
            
            return {
                pose: { x: robotGroup.position.x, z: robotGroup.position.z, yaw: robotGroup.rotation.y },
                tof: { 
                    left: isMoving ? 0.8 + Math.random()*0.2 : 0, 
                    right: isMoving ? 0.8 + Math.random()*0.2 : 0 
                },
                sensors: {
                    methane: spike ? 18 + Math.random()*40 : Math.random() * 6,
                    co: spike ? 30 + Math.random()*50 : Math.random() * 4, 
                    sulfur: 0, co2: 400, o2: 21.0, water: 0
                }
            };
        }
        
        // WebSockets
        const ws = new WebSocket('ws://localhost:8765');
        ws.onopen = () => document.getElementById('ws-status').innerText = 'WS: Connected';
        ws.onclose = () => document.getElementById('ws-status').innerText = 'WS: Disconnected';
        ws.onmessage = (event) => {
            if (!window.isLiveMode) return;
            const data = JSON.parse(event.data);
            
            const oldX = robotGroup.position.x;
            const oldZ = robotGroup.position.z;
            
            robotGroup.position.set(data.pose.x, 0, data.pose.z);
            robotGroup.rotation.y = data.pose.yaw;
            
            camera.position.x += (robotGroup.position.x - oldX);
            camera.position.z += (robotGroup.position.z - oldZ);
            
            processTelemetry(data);
        };

        const kf = {
            forward: [ { FrontR: LIFT, BackL: LIFT, FrontL: 0, BackR: 0, stubsliderbottom: SLIDE, stubsliderupper: 0 }, { FrontR: 0, BackL: 0, FrontL: LIFT, BackR: LIFT, stubsliderbottom: -SLIDE, stubsliderupper: 0 } ],
            backward: [ { FrontR: LIFT, BackL: LIFT, FrontL: 0, BackR: 0, stubsliderbottom: -SLIDE, stubsliderupper: 0 }, { FrontR: 0, BackL: 0, FrontL: LIFT, BackR: LIFT, stubsliderbottom: SLIDE, stubsliderupper: 0 } ],
            left: [ { FrontR: LIFT, BackL: LIFT, FrontL: 0, BackR: 0, stubsliderbottom: 0, stubsliderupper: TURN }, { FrontR: 0, BackL: 0, FrontL: LIFT, BackR: LIFT, stubsliderbottom: 0, stubsliderupper: -TURN } ],
            right: [ { FrontR: LIFT, BackL: LIFT, FrontL: 0, BackR: 0, stubsliderbottom: 0, stubsliderupper: -TURN }, { FrontR: 0, BackL: 0, FrontL: LIFT, BackR: LIFT, stubsliderbottom: 0, stubsliderupper: TURN } ],
            stop: [ { FrontR: 0, BackR: 0, FrontL: 0, BackL: 0, stubsliderbottom: 0, stubsliderupper: 0 } ]
        };

        function animate() {
            requestAnimationFrame(animate);

            if (!window.isLiveMode && robot && kf[window.activeAnim]) {
                const targetFrame = kf[window.activeAnim][window.frameIndex % kf[window.activeAnim].length];
                let allReached = true;
                for (const [j, val] of Object.entries(targetFrame)) {
                    let diff = val - window.currentJoints[j];
                    if (Math.abs(diff) > 0.001) {
                        allReached = false;
                        window.currentJoints[j] += diff * animSpeed;
                    } else window.currentJoints[j] = val;
                    robot.setJointValue(j, window.currentJoints[j]);
                }
                if (allReached) window.frameIndex++;

                const oldX = robotGroup.position.x;
                const oldZ = robotGroup.position.z;

                if (window.activeAnim === 'forward') robotGroup.translateZ(walkSpeed);
                if (window.activeAnim === 'backward') robotGroup.translateZ(-walkSpeed);
                if (window.activeAnim === 'left') robotGroup.rotation.y += turnSpeed;
                if (window.activeAnim === 'right') robotGroup.rotation.y -= turnSpeed;

                camera.position.x += (robotGroup.position.x - oldX);
                camera.position.z += (robotGroup.position.z - oldZ);

                dummyFrameCounter++;
                if (window.activeAnim !== 'stop' && dummyFrameCounter % 15 === 0) {
                    const dummyData = generateDummyData();
                    processTelemetry(dummyData); 
                    
                    if (ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify(dummyData));
                    }
                }
            }
            
            const snapX = Math.round(robotGroup.position.x / (hexRadius * Math.sqrt(3))) * (hexRadius * Math.sqrt(3));
            const snapZ = Math.round(robotGroup.position.z / (hexRadius * 3)) * (hexRadius * 3);
            hexGrid.position.set(snapX, 0, snapZ);

            controls.target.copy(robotGroup.position);
            controls.update(); 
            renderer.render(scene, camera); 
        }
        
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        animate();
    </script>
</body>
</html>
